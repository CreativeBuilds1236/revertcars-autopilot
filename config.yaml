# ───────────────────────────────────────────────────────────────
#  Revert Media autopilot — settings
#  Edit this file on GitHub (pencil icon) to change how the page runs.
# ───────────────────────────────────────────────────────────────

page:
  name: "Revert Media"
  handle: "revertcars.media"
  timezone: "Asia/Dubai"
  # Always added to every post (keep it short — Instagram now favours 3-8 hashtags in total)
  fixed_hashtags: ["#RevertMedia", "#UAECars"]
  max_ai_hashtags: 6

schedule:
  # Approved posts go out at the next free slot (UAE time).
  post_slots: ["13:00", "18:00", "21:00"]
  # Drafts that you don't answer within this many hours expire.
  draft_expiry_hours: 48

drafting:
  # The drafter runs once a day and makes: news_per_day news drafts + 1 "rotation" draft.
  # The rotation cycles through the lanes below, one per day. If today's lane has nothing good,
  # you get another news story instead. Set rotation: [] to switch the second draft off.
  news_per_day: 3          # 3 news + 1 rotation = 4 drafts a day (one spare, so you can skip one and still post 3)
  rotation: ["uae_wild", "throwback", "culture"]   # crazy UAE stuff → old-scene throwback → car culture
  carousel_probability: 0.8    # chance a story with 2+ good photos becomes a carousel (1.0 = always)
  min_carousel_slides: 4       # carousels always have at least this many slides
  min_carousels_per_day: 2     # at least this many of each day's drafts are carousels
  max_carousel_slides: 6       # including the cover and the follow card
  outro_slide: true            # "follow @revertcars.media" card at the end of carousels
  max_story_age_hours: 36
  min_source_chars: 500        # stories with less source text than this are skipped (too thin to fact-check)

ai:
  # Which AI writes the captions:
  #   "gemini"    → Google Gemini FREE tier. Needs the GEMINI_API_KEY secret (free from aistudio.google.com).
  #                 Note: on the free tier Google may use what's sent to improve its products.
  #   "anthropic" → Claude. Sharper, wittier captions, about 10-20 cents a month. Needs ANTHROPIC_API_KEY.
  provider: "gemini"
  gemini:
    writer_model: "gemini-3.5-flash"
    rewrite_model: "gemini-3.5-flash"
    checker_model: "gemini-3.1-flash-lite"
    # If a model is busy, out of free quota or renamed, these are tried in order:
    # "auto" = the newest Flash model available to your key (looked up live), "auto-lite" = newest Flash-Lite
    backup_models: ["auto", "gemini-3.1-flash-lite", "auto-lite"]
  anthropic:
    writer_model: "claude-haiku-5-5"
    rewrite_model: "claude-sonnet-5-5"     # only used when you tap 🔄 Rewrite
    checker_model: "claude-haiku-5-5"
  british_spelling: true

instagram:
  # "manual" → at posting time the bot sends you the finished slides + caption to upload yourself.
  # "auto"   → posts by itself. Needs the IG_ACCESS_TOKEN and IG_USER_ID secrets (README step 4).
  mode: "auto"
  api_version: "v26.0"
  # graph.facebook.com for "Unified login" tokens (new Meta apps, never expire);
  # graph.instagram.com for older "Instagram login" tokens (expire after 60 days, renewed automatically).
  api_host: "graph.facebook.com"
  # Where Instagram downloads the images from. Leave blank to use this GitHub repo's "data" branch.
  media_base_url: ""

# ───────────────────────── SOURCES ─────────────────────────
# Direct feeds. Any feed that stops working is reported in the
# "Setup check" run and simply skipped — it never breaks the system.
feeds:
  # Global
  - { name: "Motor1",        url: "https://www.motor1.com/rss/news/all/",       weight: 1.0 }
  - { name: "Carscoops",     url: "https://www.carscoops.com/feed/",            weight: 1.0 }
  - { name: "Car and Driver", url: "https://www.caranddriver.com/rss/all.xml/", weight: 1.0 }
  - { name: "Road & Track",  url: "https://www.roadandtrack.com/rss/all.xml/",  weight: 1.0 }
  - { name: "Autocar",       url: "https://www.autocar.co.uk/rss",              weight: 1.0 }
  - { name: "The Drive",     url: "https://www.thedrive.com/feed",              weight: 0.9 }
  - { name: "InsideEVs",     url: "https://insideevs.com/rss/news/all/",        weight: 0.8 }
  # Car culture — the "cool car stuff" lane (builds, barn finds, auctions, weird history)
  # (Speedhunters has gone offline; Hemmings/Autoblog/Top Gear block GitHub's servers — Top Gear & Autoblog
  #  are covered through Google News below.)
  - { name: "Hagerty",       url: "https://www.hagerty.com/media/feed/",        weight: 0.8, culture: true }
  - { name: "Jalopnik",      url: "https://jalopnik.com/rss",                   weight: 0.8, culture: true }
  # UAE — DriveArabia blocks GitHub's servers, so it's searched through Google News instead (see below)

# Google News searches (UAE edition). {brand} rotates through the brand list below.
google_news:
  edition: { hl: "en-AE", gl: "AE", ceid: "AE:en" }
  queries:
    - '"UAE" car launch when:2d'
    - 'Dubai OR "Abu Dhabi" new car unveiled when:2d'
    - 'site:yallamotor.com news when:2d'
    - 'RTA Dubai road rule OR speed limit OR Salik when:3d'
    - '"UAE fuel prices" when:5d'
    - 'SEMA OR Goodwood OR "Dubai Motor Show" OR "Tokyo Auto Salon" OR "Geneva Motor Show" when:3d'
    - 'new car reveal OR unveiled OR debut when:1d'
    - 'site:drivearabia.com when:3d'
    - 'site:topgear.com news when:2d'
    - 'site:autoblog.com when:2d'
  # "Only in the UAE" lane — the crazy local stuff. One of these gets a reserved spot every run.
  uae_wild_queries:
    - 'Dubai OR "Abu Dhabi" number plate auction record when:7d'
    - '"Dubai Police" supercar OR patrol car OR fleet when:7d'
    - 'Dubai OR UAE hypercar OR "one-off" OR "most expensive" car when:5d'
    - 'Liwa OR "Moreeb Dune" OR "hill climb" OR "Liwa festival" when:7d'
    - 'UAE OR Dubai drag race OR drift OR "Yas Marina" OR "Dubai Autodrome" when:5d'
    - 'Dubai OR "Abu Dhabi" robotaxi OR "flying taxi" OR driverless when:5d'
    - 'site:topgearme.com when:3d'
  brand_queries_per_run: 5
  brand_query: '{brand} new model OR revealed OR unveiled when:2d'
  # Only stories from these publishers are accepted from Google News.
  trusted_publishers:
    - motor1.com
    - carscoops.com
    - caranddriver.com
    - roadandtrack.com
    - topgear.com
    - autocar.co.uk
    - autoblog.com
    - evo.co.uk
    - thedrive.com
    - motortrend.com
    - insideevs.com
    - electrek.co
    - drivearabia.com
    - yallamotor.com
    - thenationalnews.com
    - wam.ae
    - rta.ae
    - reuters.com
    - bloomberg.com
    - apnews.com
    - cnbc.com
    - autonews.com
    - speedhunters.com
    - topgearme.com          # Top Gear Middle East
    - arabianbusiness.com
    - dubaipolice.gov.ae
    - adpolice.gov.ae
    - emiratesauction.com
    - motorsport.com
    - hagerty.com
    - jalopnik.com
    # - khaleejtimes.com     # remove the "#" to allow Khaleej Times (covers a lot of local car stories)
  blocked_publishers:
    - gulfnews.com
    - wheels.ae

trends:
  google_trends_geo: "AE"
  # Reddit is no longer read automatically: Reddit switched off its feeds (13 Nov 2026) and is closing
  # its public API. Instead, share any Reddit post / photo / link to the Telegram bot and it drafts it.

# Words that make a story more interesting for the UAE audience (each match adds a bit of score).
boost_keywords:
  uae: ["uae", "dubai", "abu dhabi", "sharjah", "gcc", "middle east", "saudi", "rta", "salik", "yas marina", "emirates"]
  events: ["sema", "goodwood", "motor show", "auto salon", "pebble beach", "le mans", "monterey", "festival of speed"]
  wild: ["number plate", "plate auction", "police", "hypercar", "one-off", "record", "million", "most expensive",
         "fastest", "world's", "drift", "dune", "liwa", "moreeb", "drag", "robotaxi", "flying taxi", "gold",
         "abandoned", "collection", "bugatti", "koenigsegg", "devel", "w motors", "lykan"]
  brands: ["patrol", "land cruiser", "lexus", "gt-r", "supra", "skyline", "ferrari", "lamborghini", "rolls-royce",
           "bentley", "g-class", "amg", "bmw m", "porsche", "911", "mclaren", "bugatti", "koenigsegg", "pagani",
           "range rover", "defender", "mustang", "raptor", "bronco", "wrangler", "corvette", "camaro", "tahoe",
           "escalade", "nismo", "type r", "gr ", "rs ", "byd", "tesla", "lucid", "zeekr", "jetour", "tank 300"]

# Brands used for the rotating Google News brand searches
brands: ["Nissan", "Toyota", "Lexus", "Ferrari", "Lamborghini", "Porsche", "Mercedes-AMG", "BMW M", "Rolls-Royce",
         "Bentley", "McLaren", "Aston Martin", "Ford", "Chevrolet", "GMC", "Cadillac", "Dodge", "Jeep", "Land Rover",
         "Honda", "Mazda", "Subaru", "Mitsubishi", "Hyundai N", "Kia", "Genesis", "Audi RS", "Bugatti", "Koenigsegg",
         "BYD", "Tesla", "Lucid", "Zeekr", "Jetour", "Polestar", "Maserati", "Alfa Romeo", "Lotus"]

# Stories whose titles contain these are ignored (deals, buying guides, ads...)
exclude_keywords: ["deal", "discount", "lease", "coupon", "best tires", "how to", "buying guide", "sponsored",
                   "giveaway", "insurance quote", "our picks", "ranked:", "vs.", "podcast", "quiz", "horoscope",
                   "obituary", "crash kills", "killed", "dies in", "lego", "toy", "toys", "video game", "gran turismo",
                   "forza", "playstation", "xbox", "die-cast", "diecast", "hot wheels", "merch",
                   # speculative renderings / illustrations / AI images aren't real photos — skip those stories
                   "render", "rendered", "rendering", "renderings", "renders", "imagined", "illustration",
                   "illustrated", "ai-generated", "what if", "we imagine", "digital artist"]
