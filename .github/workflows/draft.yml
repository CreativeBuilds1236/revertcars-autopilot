name: Make drafts

on:
  schedule:
    # Backup only: GitHub's own timer can run hours late, so the main trigger is cron-job.org
    # (see README "Make it run on time"). The daily plan only ever runs once a day, whoever triggers it.
    - cron: "17 8 * * *"    # 12:17 UAE
  workflow_dispatch:
    inputs:
      news:
        description: "Number of news drafts (leave both blank for the normal daily plan)"
        default: ""
      throwback:
        description: "Number of throwback drafts"
        default: ""

concurrency:
  group: revert-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/data_branch.sh pull
      - name: Draft
        run: |
          ARGS=""
          if [ -n "${{ inputs.news }}" ]; then ARGS="$ARGS --news ${{ inputs.news }}"; fi
          if [ -n "${{ inputs.throwback }}" ]; then ARGS="$ARGS --throwback ${{ inputs.throwback }}"; fi
          python -m revert draft $ARGS
